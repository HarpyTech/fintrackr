[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/app.py",
    # Route handlers — thin FastAPI wrappers; require DI + running server to exercise
    "app/api/deps.py",
    "app/api/routes/admin.py",
    "app/api/routes/auth.py",
    "app/api/routes/expenses.py",
    "app/api/routes/health.py",
    "app/api/routes/users.py",
    "app/api/routes/webauthn.py",
    "app/api/routes/web.py",
    "app/api/routes/analytics.py",
    "app/api/csrf_helper.py",
    # DB connection layer — requires a real MongoDB instance
    "app/db/mongo.py",
    # Error/telemetry registration — wired at startup, not unit-testable
    "app/core/errors.py",
    "app/core/telemetry.py",
    "app/core/tracing.py",
    "app/core/idempotency.py",
    # External-API-dependent services — require Gemini/SMTP/FIDO2/OAuth
    "app/services/analytics_agent_service.py",
    "app/services/analytics_narrative.py",
    "app/services/chart_builder.py",
    "app/services/expense_extraction_service.py",
    "app/services/expense_chat_service.py",
    "app/services/expense_service.py",
    "app/services/gemini_client.py",
    "app/services/email_service.py",
    "app/services/webauthn_service.py",
    "app/services/oauth_service.py",
    "app/services/profile_service.py",
]

[tool.coverage.report]
show_missing = true

# Coverage gate. Incrementally widened as tests are backfilled.
# Current: enforced on new SaaS modules only (see CI --cov flags).
# Next: repo-wide 80% once test backfill reaches that threshold (C2).
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: naming, UP: pyupgrade
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "N802",   # function name should be lowercase (some FastAPI deps use PascalCase)
    "N803",   # argument name should be lowercase
    "UP007",  # Use X | Y for union type (keep Optional for now during TS migration)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Gradually tighten: start permissive, add strict flags incrementally.
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
