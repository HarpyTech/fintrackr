name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pr_check.yml

  deploy-cloud-run:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'develop' && 'dev' ||  'develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependency vulnerability scan ──────────────────────────────────
      # Python packages are covered by the image scan below (Trivy reads the
      # image's site-packages); npm packages never reach the final image, so
      # they are audited here.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Scan npm dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Authenticate to Google Cloud (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ── Runtime environment ────────────────────────────────────────────
      # The env block below is the single allow-list of settings that reach
      # the container. Every non-empty APP_<NAME> becomes <NAME> in the Cloud
      # Run env file; unset secrets fall back to defaults in app/core/config.py.
      # ENVIRONMENT and COOKIE_SECURE are intentionally absent — both are
      # derived from K_SERVICE at runtime.
      - name: Build Cloud Run env file
        shell: bash
        env:
          # Core
          APP_PROJECT_NAME: ${{ secrets.APP_PROJECT_NAME }}
          APP_API_V1_STR: ${{ secrets.APP_API_V1_STR }}
          APP_LOG_LEVEL: ${{ secrets.APP_LOG_LEVEL }}
          # Auth
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_ALGORITHM: ${{ secrets.APP_ALGORITHM }}
          APP_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.APP_ACCESS_TOKEN_EXPIRE_MINUTES }}
          APP_REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.APP_REFRESH_TOKEN_EXPIRE_DAYS }}
          APP_CORS_ORIGINS: ${{ secrets.APP_CORS_ORIGINS }}
          # WebAuthn
          APP_WEBAUTHN_RP_ID: ${{ secrets.APP_WEBAUTHN_RP_ID }}
          APP_WEBAUTHN_RP_NAME: ${{ secrets.APP_WEBAUTHN_RP_NAME }}
          APP_WEBAUTHN_ORIGIN: ${{ secrets.APP_WEBAUTHN_ORIGIN }}
          # Google OAuth
          APP_GOOGLE_CLIENT_ID: ${{ secrets.APP_GOOGLE_CLIENT_ID }}
          APP_GOOGLE_CLIENT_SECRET: ${{ secrets.APP_GOOGLE_CLIENT_SECRET }}
          APP_GOOGLE_REDIRECT_URI: ${{ secrets.APP_GOOGLE_REDIRECT_URI }}
          APP_GOOGLE_ALLOWED_DOMAINS: ${{ secrets.APP_GOOGLE_ALLOWED_DOMAINS }}
          # MongoDB
          APP_MONGODB_URI: ${{ secrets.APP_MONGODB_URI }}
          APP_MONGODB_DB: ${{ secrets.APP_MONGODB_DB }}
          # Gemini
          APP_GEMINI_API_KEY: ${{ secrets.APP_GEMINI_API_KEY }}
          APP_GEMINI_MODEL: ${{ secrets.APP_GEMINI_MODEL }}
          # OTP
          APP_SIGNUP_OTP_EXPIRY_MINUTES: ${{ secrets.APP_SIGNUP_OTP_EXPIRY_MINUTES }}
          APP_SIGNUP_OTP_LENGTH: ${{ secrets.APP_SIGNUP_OTP_LENGTH }}
          APP_SIGNUP_OTP_MAX_ATTEMPTS: ${{ secrets.APP_SIGNUP_OTP_MAX_ATTEMPTS }}
          APP_SIGNUP_OTP_WINDOW_MINUTES: ${{ secrets.APP_SIGNUP_OTP_WINDOW_MINUTES }}
          # SMTP
          APP_SMTP_HOST: ${{ secrets.APP_SMTP_HOST }}
          APP_SMTP_PORT: ${{ secrets.APP_SMTP_PORT }}
          APP_SMTP_USERNAME: ${{ secrets.APP_SMTP_USERNAME }}
          APP_SMTP_PASSWORD: ${{ secrets.APP_SMTP_PASSWORD }}
          APP_SMTP_USE_TLS: ${{ secrets.APP_SMTP_USE_TLS }}
          APP_SMTP_USE_SSL: ${{ secrets.APP_SMTP_USE_SSL }}
          APP_SMTP_TIMEOUT_SECONDS: ${{ secrets.APP_SMTP_TIMEOUT_SECONDS }}
          APP_SMTP_FROM_EMAIL: ${{ secrets.APP_SMTP_FROM_EMAIL }}
          APP_SMTP_BCC_EMAILS: ${{ secrets.APP_SMTP_BCC_EMAILS }}
          # Frontend runtime config (served at /runtime-config.js)
          APP_FEATURE_SUPPORT_PAGE_ENABLED: ${{ secrets.APP_FEATURE_SUPPORT_PAGE_ENABLED }}
          APP_FEATURE_BILLING_ENABLED: ${{ secrets.APP_FEATURE_BILLING_ENABLED }}
          APP_FEATURE_ADMIN_ENABLED: ${{ secrets.APP_FEATURE_ADMIN_ENABLED }}
          APP_FEATURE_GOOGLE_SIGNIN_ENABLED: ${{ secrets.APP_FEATURE_GOOGLE_SIGNIN_ENABLED }}
          APP_SUPPORT_EMAIL: ${{ secrets.APP_SUPPORT_EMAIL }}
          # Platform admins and the fallback timezone for "today"
          APP_ADMIN_EMAILS: ${{ secrets.APP_ADMIN_EMAILS }}
          APP_DEFAULT_TIMEZONE: ${{ secrets.APP_DEFAULT_TIMEZONE }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - << 'PY'
          import os
          import sys
          import yaml

          data = {
              key[len("APP_"):]: value
              for key, value in sorted(os.environ.items())
              if key.startswith("APP_") and value
          }
          data["BUILD_VERSION"] = os.environ["BUILD_SHA"]

          errors = []
          for required in ("SECRET_KEY", "MONGODB_URI"):
              if required not in data:
                  errors.append(f"Required secret APP_{required} is not set.")
          if "SECRET_KEY" in data and len(data["SECRET_KEY"]) < 32:
              errors.append("APP_SECRET_KEY must be at least 32 characters long.")
          if "GOOGLE_CLIENT_ID" in data:
              for dependent in ("GOOGLE_CLIENT_SECRET", "GOOGLE_REDIRECT_URI"):
                  if dependent not in data:
                      errors.append(f"APP_GOOGLE_CLIENT_ID is set but APP_{dependent} is not.")
          google_flag = data.get("FEATURE_GOOGLE_SIGNIN_ENABLED", "").strip().lower()
          if google_flag in {"1", "true", "yes", "on", "y", "t"}:
              for credential in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REDIRECT_URI"):
                  if credential not in data:
                      errors.append(
                          f"APP_FEATURE_GOOGLE_SIGNIN_ENABLED is on but APP_{credential} is not set."
                      )

          if errors:
              for message in errors:
                  print(f"::error::{message}")
              sys.exit(1)

          with open(".cloudrun.env.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(data, f)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Cloud Run environment keys set\n\n")
              summary.write("\n".join(f"- `{key}`" for key in data) + "\n")
          PY

      - name: Resolve deploy parameters
        shell: bash
        run: |
          # Determine environment suffix from branch name
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${BRANCH}" = "main" ]; then
            ENV="prod"
            DEFAULT_REGION="us-central1"
          else
            ENV="dev"
            DEFAULT_REGION="us-east1"
          fi

          REGION="${{ secrets.GCP_REGION }}"
          if [ -z "${REGION}" ]; then
            REGION="${DEFAULT_REGION}"
          fi

          BASE_SERVICE="${{ secrets.CLOUD_RUN_SERVICE }}"
          if [ -z "${BASE_SERVICE}" ]; then
            BASE_SERVICE="finance"
          fi

          # Strip any existing env suffix then re-apply the correct one
          BASE_SERVICE="${BASE_SERVICE%-dev}"
          BASE_SERVICE="${BASE_SERVICE%-prod}"
          SERVICE_NAME="${BASE_SERVICE}-${ENV}"

          AR_REPOSITORY="${SERVICE_NAME}"
          AR_HOST="${REGION}-docker.pkg.dev"
          IMAGE_URI="${AR_HOST}/${{ secrets.GCP_PROJECT_ID }}/${AR_REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}"

          echo "REGION=${REGION}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "AR_REPOSITORY=${AR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "AR_HOST=${AR_HOST}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Ensure Artifact Registry repository exists
        shell: bash
        run: |
          if ! gcloud artifacts repositories describe "${AR_REPOSITORY}" --location "${REGION}" --project "${{ secrets.GCP_PROJECT_ID }}" > /dev/null 2>&1; then
            gcloud artifacts repositories create "${AR_REPOSITORY}" \
              --repository-format=docker \
              --location "${REGION}" \
              --description "Docker images for ${SERVICE_NAME}" \
              --project "${{ secrets.GCP_PROJECT_ID }}"
          fi

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${AR_HOST}" --quiet

      # The image carries no environment or secret values — they are injected
      # by `gcloud run deploy --env-vars-file` below.
      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_URI}" --build-arg INSTALL_MODE=ci .

      # Reports fixable CRITICAL/HIGH findings without blocking deployment.
      - name: Scan container image for vulnerabilities
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_URI }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Notify about container vulnerabilities
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "::warning::Trivy found fixable CRITICAL or HIGH vulnerabilities in ${IMAGE_URI}. Deployment will continue."
          echo "### Container vulnerability warning" >> "$GITHUB_STEP_SUMMARY"
          echo "Trivy found fixable CRITICAL or HIGH vulnerabilities in ${IMAGE_URI}. Deployment continued." >> "$GITHUB_STEP_SUMMARY"

      - name: Push image to Artifact Registry
        run: |
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --cpu 2 \
            --memory 4Gi \
            --cpu-boost \
            --execution-environment gen2 \
            --env-vars-file .cloudrun.env.yaml \
            --quiet

      - name: Smoke test deployed service
        run: |
          URL=$(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --format='value(status.url)')
          echo "Service URL: ${URL}"
          if ! RESPONSE=$(curl --silent --show-error --fail-with-body \
            --retry 5 --retry-connrefused --retry-delay 2 \
            --write-out '\n%{http_code}' "${URL}/health"); then
            HTTP_STATUS=${RESPONSE##*$'\n'}
            BODY=${RESPONSE%$'\n'*}
            echo "ERROR: Health endpoint returned HTTP ${HTTP_STATUS}"
            echo "Response body: ${BODY}"
            exit 1
          fi
          HTTP_STATUS=${RESPONSE##*$'\n'}
          BODY=${RESPONSE%$'\n'*}
          if [ "${HTTP_STATUS}" != "200" ] || \
            ! printf '%s' "${BODY}" | python3 -c '
          import json, sys
          try:
              healthy = json.load(sys.stdin).get("status") == "UP"
          except (json.JSONDecodeError, ValueError):
              healthy = False
          sys.exit(0 if healthy else 1)
          '; then
            echo "ERROR: Health endpoint did not return HTTP 200 with status=UP"
            echo "HTTP status: ${HTTP_STATUS}"
            echo "Response body: ${BODY}"
            exit 1
          fi
          echo "Smoke test passed: ${URL}/health"

      - name: Remove env file from runner
        if: always()
        run: rm -f .cloudrun.env.yaml
