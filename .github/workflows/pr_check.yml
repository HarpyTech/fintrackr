name: Build & Health Check

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade pip==26.2.2
          pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Scan dependencies for vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Run tests with coverage gate
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production-use-32chars"
          MONGODB_URI: "mongodb://localhost:27017"
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=75

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build
